<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Emotion Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 3rem;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    h1 { font-size: 2.2rem; text-align: center; margin-bottom: 0.5rem; color: #e94560; }
    p.subtitle { text-align: center; color: rgba(255,255,255,0.6); margin-bottom: 2rem; }
    textarea {
      width: 100%; height: 120px; padding: 1rem;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05); color: #fff;
      font-size: 1rem; resize: none; outline: none;
      transition: border 0.3s;
    }
    textarea:focus { border-color: #e94560; }
    button {
      width: 100%; padding: 1rem; margin-top: 1rem;
      background: linear-gradient(90deg, #e94560, #0f3460);
      color: white; border: none; border-radius: 10px;
      font-size: 1.1rem; font-weight: bold; cursor: pointer;
      transition: opacity 0.3s;
    }
    button:hover { opacity: 0.9; }
    #result {
      margin-top: 1.5rem; padding: 1.2rem;
      background: rgba(255,255,255,0.05);
      border-radius: 10px; border-left: 4px solid #e94560;
      min-height: 50px; font-size: 1rem; line-height: 1.6;
      display: none;
    }
    #result.visible { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎭 Emotion Detector</h1>
    <p class="subtitle">Powered by Watson NLP — Analyze emotions in any text</p>
    <textarea id="textToAnalyze" placeholder="Enter text to analyze emotions..."></textarea>
    <button onclick="RunSentimentAnalysis()">Analyze Emotions</button>
    <div id="result"></div>
  </div>
  <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
